<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebScan — تحويل صور لـ PDF مع محاذاة يدوية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0F1923;
            --surface: #19283A;
            --card: #1E3248;
            --accent: #F4B942;
            --accent2: #3D9BE9;
            --text: #EEF2F7;
            --muted: #7A90A8;
            --border: #2A3F55;
            --success: #34C98B;
            --danger: #E05C6A;
            --radius: 14px;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px 16px 40px;
            background-image: radial-gradient(ellipse at 20% 10%, rgba(61, 155, 233, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(244, 185, 66, 0.05) 0%, transparent 50%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding: 0 4px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 1.1rem;
        }
        #cvStatus {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        #cvStatus.loading {
            background: rgba(244, 185, 66, 0.12);
            color: var(--accent);
            border: 1px solid rgba(244, 185, 66, 0.25);
            animation: pulse 1.5s ease-in-out infinite;
        }
        #cvStatus.ready {
            background: rgba(52, 201, 139, 0.12);
            color: var(--success);
            border: 1px solid rgba(52, 201, 139, 0.25);
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1
            }
            50% {
                opacity: 0.5
            }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 14px;
        }

        .upload-zone {
            border: 2px dashed var(--border);
            background: transparent;
            text-align: center;
            padding: 36px 20px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .upload-zone:hover,
        .upload-zone.drag-over {
            border-color: var(--accent2);
            background: rgba(61, 155, 233, 0.06);
        }
        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .upload-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .upload-sub {
            font-size: 0.82rem;
            color: var(--muted);
        }
        #fileInput {
            display: none;
        }

        .input-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .text-input {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            text-align: right;
        }
        .text-input:focus {
            border-color: var(--accent2);
        }
        .text-input::placeholder {
            color: var(--muted);
        }

        #previewSection {
            display: none;
        }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .clear-btn {
            font-size: 0.8rem;
            color: var(--danger);
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .clear-btn:hover {
            background: rgba(224, 92, 106, 0.1);
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        .preview-item {
            position: relative;
            aspect-ratio: 3/4;
            border-radius: 8px;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--border);
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .preview-remove {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            background: rgba(224, 92, 106, 0.9);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.7rem;
            color: white;
            line-height: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-edit {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            background: rgba(61, 155, 233, 0.9);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.7rem;
            color: white;
            line-height: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-num {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        #convertBtn {
            display: none;
            width: 100%;
            background: linear-gradient(135deg, #3D9BE9, #2B7CC5);
            border: none;
            border-radius: var(--radius);
            padding: 16px;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 14px;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(61, 155, 233, 0.3);
        }
        #convertBtn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(61, 155, 233, 0.4);
        }
        #convertBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #progressSection {
            display: none;
        }
        .progress-card {
            padding: 20px;
        }
        #progressText {
            font-size: 0.9rem;
            color: var(--muted);
            text-align: center;
            margin-bottom: 12px;
        }
        .progress-bar-bg {
            height: 6px;
            background: var(--card);
            border-radius: 3px;
            overflow: hidden;
        }
        #progressBar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent2), var(--accent));
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }

        #flash {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 14px;
            display: none;
        }
        #flash.error {
            background: rgba(224, 92, 106, 0.15);
            color: var(--danger);
            border: 1px solid rgba(224, 92, 106, 0.3);
        }
        #flash.success {
            background: rgba(52, 201, 139, 0.15);
            color: var(--success);
            border: 1px solid rgba(52, 201, 139, 0.3);
        }

        /* كارت الكاميرا المنفصل */
        .camera-card {
            text-align: center;
        }
        .btn-camera {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }
        .btn-camera:hover {
            background: var(--accent2);
            border-color: var(--accent2);
            color: #fff;
        }

        /* مودال الكاميرا */
        #cameraModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #cameraModal.open {
            display: flex;
        }
        #cameraVideo {
            width: 100%;
            max-width: 640px;
            border-radius: 12px;
            background: #000;
            aspect-ratio: 4/3;
            object-fit: cover;
            border: 2px solid var(--border);
        }
        .camera-controls {
            display: flex;
            gap: 16px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .cam-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(6px);
        }
        .cam-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #fff;
        }
        .cam-btn.capture {
            width: 68px;
            height: 68px;
            background: #fff;
            border-color: #fff;
            color: #000;
            font-size: 1.5rem;
        }
        .cam-btn.capture:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }
        .cam-btn.close {
            background: rgba(224, 92, 106, 0.3);
            border-color: var(--danger);
        }
        .camera-hint {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
        }

        /* مودال تعديل المحاذاة */
        #editModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #editModal.open {
            display: flex;
        }
        .edit-container {
            position: relative;
            max-width: 95vw;
            max-height: 85vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border);
        }
        #editCanvas {
            display: block;
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }
        .edit-controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .edit-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .edit-btn.primary {
            background: var(--accent2);
            border-color: var(--accent2);
            color: white;
        }
        .edit-btn:hover {
            filter: brightness(1.2);
        }
        .edit-hint {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            margin-top: 8px;
            text-align: center;
        }
        footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--muted);
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">📄</div>
            WebScan
        </div>
        <div id="cvStatus" class="loading">جاري التحميل...</div>
    </header>

    <div id="flash"></div>

    <!-- رفع الملفات -->
    <div class="card upload-zone" id="uploadZone">
        <div class="upload-icon">📎</div>
        <p class="upload-title">اسحب وأفلت الصور هنا</p>
        <p class="upload-sub">أو اضغط للاختيار · JPG, PNG, WEBP · حتى 20 صورة</p>
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp" multiple>
    </div>

    <!-- الاسم -->
    <div class="card">
        <label class="input-label" for="nameInput">الاسم (اختياري — يظهر في أعلى كل صفحة)</label>
        <input type="text" id="nameInput" class="text-input" placeholder="اكتب الاسم هنا..." dir="rtl">
    </div>

    <!-- كارت الكاميرا منفصل -->
    <div class="card camera-card">
        <p style="margin-bottom:12px; font-weight:600;">أو التقط صورة بالكاميرا</p>
        <button class="btn-camera" id="openCameraBtn">
            📷 فتح الكاميرا
        </button>
    </div>

    <!-- معاينة الصور -->
    <div id="previewSection">
        <div class="section-header">
            <span class="section-title">الصور المختارة (<span id="imgCount">0</span>)</span>
            <button class="clear-btn" id="clearBtn">مسح الكل</button>
        </div>
        <div class="preview-grid" id="previewGrid"></div>
    </div>

    <button id="convertBtn">⬇ تحويل وتنزيل PDF</button>

    <div id="progressSection">
        <div class="card progress-card">
            <p id="progressText">جاري معالجة الصور...</p>
            <div class="progress-bar-bg"><div id="progressBar"></div></div>
        </div>
    </div>

    <!-- مودال الكاميرا -->
    <div id="cameraModal">
        <video id="cameraVideo" autoplay playsinline></video>
        <p class="camera-hint">وجّه الكاميرا نحو المستند والتقط الصورة</p>
        <div class="camera-controls">
            <button class="cam-btn close" id="closeCameraBtn" title="إغلاق">✕</button>
            <button class="cam-btn capture" id="captureBtn" title="التقاط">📸</button>
            <button class="cam-btn" id="switchCameraBtn" title="تبديل الكاميرا">🔄</button>
        </div>
    </div>

    <!-- مودال تعديل المحاذاة -->
    <div id="editModal">
        <div class="edit-container">
            <canvas id="editCanvas"></canvas>
        </div>
        <p class="edit-hint">اسحب الزوايا 🟢 لضبط حدود المستند</p>
        <div class="edit-controls">
            <button class="edit-btn" id="editResetBtn">إعادة التعيين</button>
            <button class="edit-btn" id="editCancelBtn">إلغاء</button>
            <button class="edit-btn primary" id="editApplyBtn">✅ تطبيق</button>
        </div>
    </div>

    <footer>
        <p>WebScan · يعمل بالكامل في المتصفح · لا يتم رفع أي بيانات</p>
    </footer>

    <script>
        // ══════════════════════════════════════════
        //  STATE
        // ══════════════════════════════════════════
        let cvReady = false;
        let selectedFiles = [];
        const MAX_FILES = 20;
        const A4_W = 1240,
            A4_H = 1754;

        // Camera
        let cameraStream = null;
        let cameraFacingMode = 'environment';
        let cameraModalOpen = false;

        // Manual Edit
        let editFileIndex = -1;
        let editImage = null; // Image element
        let editQuad = []; // [{x,y}, ...] TL, TR, BR, BL
        let editInitialQuad = [];
        let editDragIndex = -1;
        let editScale = 1;
        let editOffsetX = 0,
            editOffsetY = 0;

        // ══════════════════════════════════════════
        //  OPENCV LOADING
        // ══════════════════════════════════════════
        window.Module = {
            onRuntimeInitialized: function() {
                cvReady = true;
                const el = document.getElementById('cvStatus');
                el.textContent = '✓ جاهز';
                el.className = 'ready';
            }
        };
        (function loadOpenCV() {
            const s = document.createElement('script');
            s.src = 'https://docs.opencv.org/4.8.0/opencv.js';
            s.async = true;
            document.head.appendChild(s);
        })();

        // ══════════════════════════════════════════
        //  UI HELPERS
        // ══════════════════════════════════════════
        function showFlash(msg, type = 'error') {
            const el = document.getElementById('flash');
            el.textContent = msg;
            el.className = type;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function setProgress(pct, text) {
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressText').textContent = text;
        }

        function updateUI() {
            const hasFiles = selectedFiles.length > 0;
            document.getElementById('previewSection').style.display = hasFiles ? 'block' : 'none';
            document.getElementById('convertBtn').style.display = hasFiles ? 'block' : 'none';
            document.getElementById('imgCount').textContent = selectedFiles.length;
            renderPreviews();
        }

        function renderPreviews() {
            const grid = document.getElementById('previewGrid');
            grid.innerHTML = '';
            selectedFiles.forEach((file, idx) => {
                const url = URL.createObjectURL(file);
                const item = document.createElement('div');
                item.className = 'preview-item';
                item.innerHTML = `
                    <img src="${url}" alt="صورة ${idx+1}" onload="URL.revokeObjectURL(this.src)">
                    <button class="preview-remove" title="حذف">✕</button>
                    <button class="preview-edit" title="تعديل المحاذاة">✎</button>
                    <span class="preview-num">${idx + 1}</span>
                `;
                item.querySelector('.preview-remove').addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedFiles.splice(idx, 1);
                    updateUI();
                });
                item.querySelector('.preview-edit').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openEditModal(idx);
                });
                grid.appendChild(item);
            });
        }

        // ══════════════════════════════════════════
        //  FILE HANDLING
        // ══════════════════════════════════════════
        function addFiles(newFiles) {
            const allowed = ['.jpg', '.jpeg', '.png', '.webp'];
            const valid = Array.from(newFiles).filter(f => {
                const ext = f.name.slice(f.name.lastIndexOf('.')).toLowerCase();
                return allowed.includes(ext);
            });
            if (!valid.length) { showFlash('صيغة غير مدعومة. استخدم JPG أو PNG أو WEBP');
                return; }
            const remaining = MAX_FILES - selectedFiles.length;
            if (remaining <= 0) { showFlash(`الحد الأقصى ${MAX_FILES} صورة`);
                return; }
            const toAdd = valid.slice(0, remaining);
            if (valid.length > remaining) showFlash(`تم إضافة ${toAdd.length} صورة فقط (الحد ${MAX_FILES})`,
                'error');
            selectedFiles.push(...toAdd);
            updateUI();
        }

        document.getElementById('uploadZone').addEventListener('click', () => document.getElementById(
            'fileInput').click());
        document.getElementById('fileInput').addEventListener('change', e => { addFiles(e.target.files);
            e.target.value = ''; });
        document.getElementById('clearBtn').addEventListener('click', () => { selectedFiles = [];
            updateUI(); });

        const zone = document.getElementById('uploadZone');
        zone.addEventListener('dragover', e => { e.preventDefault();
            zone.classList.add('drag-over'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
        zone.addEventListener('drop', e => { e.preventDefault();
            zone.classList.remove('drag-over');
            addFiles(e.dataTransfer.files); });

        // ══════════════════════════════════════════
        //  CAMERA
        // ══════════════════════════════════════════
        const cameraModal = document.getElementById('cameraModal');
        const cameraVideo = document.getElementById('cameraVideo');
        const openCameraBtn = document.getElementById('openCameraBtn');
        const closeCameraBtn = document.getElementById('closeCameraBtn');
        const captureBtn = document.getElementById('captureBtn');
        const switchCameraBtn = document.getElementById('switchCameraBtn');

        async function openCamera() {
            if (selectedFiles.length >= MAX_FILES) {
                showFlash(`الحد الأقصى ${MAX_FILES} صورة`);
                return;
            }
            try {
                stopCameraStream();
                const constraints = {
                    video: {
                        facingMode: cameraFacingMode,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };
                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                cameraVideo.srcObject = cameraStream;
                cameraModal.classList.add('open');
                cameraModalOpen = true;
            } catch (err) {
                console.error(err);
                showFlash('تعذر فتح الكاميرا. تأكد من السماح بالوصول واستخدام HTTPS.');
            }
        }

        function stopCameraStream() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            cameraVideo.srcObject = null;
            cameraModal.classList.remove('open');
            cameraModalOpen = false;
        }

        function capturePhoto() {
            if (!cameraStream || !cameraModalOpen) return;
            const video = cameraVideo;
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            if (cameraFacingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0);
            canvas.toBlob(blob => {
                if (!blob) return showFlash('فشل الالتقاط');
                const file = new File([blob], `cam_${Date.now()}.jpg`, { type: 'image/jpeg' });
                addFiles([file]);
                cameraVideo.style.opacity = '0.3';
                setTimeout(() => { cameraVideo.style.opacity = '1'; }, 150);
            }, 'image/jpeg', 0.9);
        }

        async function switchCamera() {
            cameraFacingMode = cameraFacingMode === 'environment' ? 'user' : 'environment';
            if (cameraModalOpen) {
                stopCameraStream();
                await new Promise(r => setTimeout(r, 300));
                await openCamera();
            }
        }

        openCameraBtn.addEventListener('click', openCamera);
        closeCameraBtn.addEventListener('click', stopCameraStream);
        captureBtn.addEventListener('click', capturePhoto);
        switchCameraBtn.addEventListener('click', switchCamera);
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && cameraModalOpen)
        stopCameraStream(); });
        document.addEventListener('visibilitychange', () => { if (document.hidden && cameraModalOpen)
        stopCameraStream(); });

        // ══════════════════════════════════════════
        //  IMAGE LOADING
        // ══════════════════════════════════════════
        function loadImageToCanvas(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    resolve(canvas);
                };
                img.onerror = reject;
                img.src = url;
            });
        }

        // ══════════════════════════════════════════
        //  OPENCV UTILS
        // ══════════════════════════════════════════
        function orderPoints(pts) {
            pts.sort((a, b) => (a.x + a.y) - (b.x + b.y));
            const tl = pts[0],
                br = pts[3];
            const rem = [pts[1], pts[2]];
            rem.sort((a, b) => (a.x - a.y) - (b.x - b.y));
            return [tl, rem[0], br, rem[1]];
        }

        function getDocumentQuadFromMat(src) {
            const origH = src.rows,
                origW = src.cols;
            const ratio = origH > 1000 ? origH / 1000 : 1;
            const rH = Math.round(origH / ratio),
                rW = Math.round(origW / ratio);
            let resized = new cv.Mat();
            cv.resize(src, resized, new cv.Size(rW, rH));
            let gray = new cv.Mat();
            cv.cvtColor(resized, gray, cv.COLOR_RGBA2GRAY);
            resized.delete();
            cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
            let edges = new cv.Mat();
            cv.Canny(gray, edges, 50, 150);
            gray.delete();
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
            edges.delete();
            hierarchy.delete();
            let areas = [];
            for (let i = 0; i < contours.size(); i++) areas.push({ i, area: cv.contourArea(contours.get(i)) });
            areas.sort((a, b) => b.area - a.area);
            let screenCnt = null;
            for (let k = 0; k < Math.min(areas.length, 10); k++) {
                const cnt = contours.get(areas[k].i);
                const peri = cv.arcLength(cnt, true);
                let approx = new cv.Mat();
                cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                if (approx.rows === 4) { screenCnt = approx; break; }
                approx.delete();
            }
            contours.delete();
            if (!screenCnt) return null;
            const pts = [];
            for (let i = 0; i < 4; i++) {
                pts.push({
                    x: screenCnt.data32S[i * 2] * ratio,
                    y: screenCnt.data32S[i * 2 + 1] * ratio
                });
            }
            screenCnt.delete();
            return orderPoints(pts);
        }

        function warpImageWithQuad(srcMat, quad, outW, outH) {
            const [tl, tr, br, bl] = quad;
            const srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, [tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y]);
            const dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, outW - 1, 0, outW - 1, outH - 1, 0,
            outH - 1]);
            const M = cv.getPerspectiveTransform(srcPts, dstPts);
            srcPts.delete();
            dstPts.delete();
            let warped = new cv.Mat();
            cv.warpPerspective(srcMat, warped, M, new cv.Size(outW, outH));
            M.delete();
            return warped;
        }

        // ══════════════════════════════════════════
        //  MANUAL EDIT MODAL
        // ══════════════════════════════════════════
        const editModal = document.getElementById('editModal');
        const editCanvas = document.getElementById('editCanvas');
        const editApplyBtn = document.getElementById('editApplyBtn');
        const editResetBtn = document.getElementById('editResetBtn');
        const editCancelBtn = document.getElementById('editCancelBtn');
        const ctx = editCanvas.getContext('2d');

        function getHandlePos(quad, idx) {
            return {
                x: quad[idx].x * editScale + editOffsetX,
                y: quad[idx].y * editScale + editOffsetY
            };
        }

        function drawEditCanvas() {
            if (!editImage) return;
            ctx.clearRect(0, 0, editCanvas.width, editCanvas.height);
            ctx.drawImage(editImage, editOffsetX, editOffsetY, editImage.width * editScale, editImage.height *
                editScale);
            // Draw quadrilateral
            ctx.beginPath();
            ctx.strokeStyle = '#3D9BE9';
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 4]);
            for (let i = 0; i < 4; i++) {
                const p = getHandlePos(editQuad, i);
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.setLineDash([]);
            // Handles
            editQuad.forEach((_, i) => {
                const p = getHandlePos(editQuad, i);
                ctx.beginPath();
                ctx.arc(p.x, p.y, 12, 0, 2 * Math.PI);
                ctx.fillStyle = '#F4B942';
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        function getEventPos(e) {
            const rect = editCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (editCanvas.width / rect.width),
                y: (clientY - rect.top) * (editCanvas.height / rect.height)
            };
        }

        function findHandleIndex(pos) {
            for (let i = 0; i < 4; i++) {
                const p = getHandlePos(editQuad, i);
                if (Math.hypot(pos.x - p.x, pos.y - p.y) < 20) return i;
            }
            return -1;
        }

        function onEditMouseDown(e) {
            e.preventDefault();
            const pos = getEventPos(e);
            editDragIndex = findHandleIndex(pos);
        }

        function onEditMouseMove(e) {
            if (editDragIndex === -1) return;
            e.preventDefault();
            const pos = getEventPos(e);
            // Update quad point in image coordinates
            editQuad[editDragIndex] = {
                x: (pos.x - editOffsetX) / editScale,
                y: (pos.y - editOffsetY) / editScale
            };
            drawEditCanvas();
        }

        function onEditMouseUp() {
            editDragIndex = -1;
        }

        async function openEditModal(index) {
            if (!cvReady) { showFlash('انتظر حتى يكتمل تحميل المحرك');
                return; }
            editFileIndex = index;
            const file = selectedFiles[index];
            const url = URL.createObjectURL(file);
            editImage = new Image();
            editImage.onload = async () => {
                URL.revokeObjectURL(url);
                // Fit canvas to screen
                const maxW = window.innerWidth * 0.9;
                const maxH = window.innerHeight * 0.6;
                const scale = Math.min(maxW / editImage.width, maxH / editImage.height, 1);
                editCanvas.width = editImage.width * scale;
                editCanvas.height = editImage.height * scale;
                editScale = scale;
                editOffsetX = 0;
                editOffsetY = 0;

                // Get initial quad using OpenCV
                const mat = cv.imread(editImage);
                let detected = getDocumentQuadFromMat(mat);
                mat.delete();
                if (!detected) {
                    detected = [
                        { x: 0, y: 0 }, { x: editImage.width, y: 0 },
                        { x: editImage.width, y: editImage.height }, { x: 0, y: editImage.height }
                    ];
                }
                editQuad = detected.map(p => ({ x: p.x, y: p.y }));
                editInitialQuad = detected.map(p => ({ x: p.x, y: p.y }));
                drawEditCanvas();
                editModal.classList.add('open');
            };
            editImage.src = url;
        }

        function closeEditModal() {
            editModal.classList.remove('open');
            editImage = null;
            editFileIndex = -1;
            editQuad = [];
            editDragIndex = -1;
        }

        function resetEditQuad() {
            if (!editImage) return;
            editQuad = editInitialQuad.map(p => ({ x: p.x, y: p.y }));
            drawEditCanvas();
        }

        async function applyEdit() {
            if (!editImage || editFileIndex < 0) return;
            const srcMat = cv.imread(editImage);
            const outW = editImage.width;
            const outH = editImage.height;
            let warped = warpImageWithQuad(srcMat, editQuad, outW, outH);
            srcMat.delete();

            const outCanvas = document.createElement('canvas');
            cv.imshow(outCanvas, warped);
            warped.delete();

            const blob = await new Promise(resolve => outCanvas.toBlob(resolve, 'image/jpeg', 0.92));
            const newFile = new File([blob], `edited_${Date.now()}.jpg`, { type: 'image/jpeg' });
            selectedFiles[editFileIndex] = newFile;
            updateUI();
            closeEditModal();
            showFlash('تم تطبيق التعديل بنجاح', 'success');
        }

        editApplyBtn.addEventListener('click', applyEdit);
        editResetBtn.addEventListener('click', resetEditQuad);
        editCancelBtn.addEventListener('click', closeEditModal);

        editCanvas.addEventListener('mousedown', onEditMouseDown);
        editCanvas.addEventListener('mousemove', onEditMouseMove);
        editCanvas.addEventListener('mouseup', onEditMouseUp);
        editCanvas.addEventListener('mouseleave', onEditMouseUp);
        editCanvas.addEventListener('touchstart', onEditMouseDown, { passive: false });
        editCanvas.addEventListener('touchmove', onEditMouseMove, { passive: false });
        editCanvas.addEventListener('touchend', onEditMouseUp);

        // ══════════════════════════════════════════
        //  PROCESS IMAGE (for PDF)
        // ══════════════════════════════════════════
        function detectAndAlign(src) {
            const origH = src.rows,
                origW = src.cols;
            const ratio = origH > 1000 ? origH / 1000 : 1;
            const rH = Math.round(origH / ratio),
                rW = Math.round(origW / ratio);
            let resized = new cv.Mat();
            cv.resize(src, resized, new cv.Size(rW, rH));
            let gray = new cv.Mat();
            cv.cvtColor(resized, gray, cv.COLOR_RGBA2GRAY);
            resized.delete();
            cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
            let edges = new cv.Mat();
            cv.Canny(gray, edges, 50, 150);
            gray.delete();
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
            edges.delete();
            hierarchy.delete();
            let areas = [];
            for (let i = 0; i < contours.size(); i++) areas.push({ i, area: cv.contourArea(contours.get(i)) });
            areas.sort((a, b) => b.area - a.area);
            let screenCnt = null;
            for (let k = 0; k < Math.min(areas.length, 10); k++) {
                const cnt = contours.get(areas[k].i);
                const peri = cv.arcLength(cnt, true);
                let approx = new cv.Mat();
                cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                if (approx.rows === 4) { screenCnt = approx; break; }
                approx.delete();
            }
            contours.delete();
            if (!screenCnt) return src.clone();
            const pts = [];
            for (let i = 0; i < 4; i++) pts.push({ x: screenCnt.data32S[i * 2] * ratio, y: screenCnt.data32S[i *
                    2 + 1] * ratio });
            screenCnt.delete();
            const [tl, tr, br, bl] = orderPoints(pts);
            const maxW = Math.max(Math.hypot(br.x - bl.x, br.y - bl.y), Math.hypot(tr.x - tl.x, tr.y - tl.y));
            const maxH = Math.max(Math.hypot(tr.x - br.x, tr.y - br.y), Math.hypot(tl.x - bl.x, tl.y - bl.y));
            if (maxW < 50 || maxH < 50) return src.clone();
            return warpImageWithQuad(src, [tl, tr, br, bl], Math.round(maxW), Math.round(maxH));
        }

        function enhanceImage(src) {
            let bgr = new cv.Mat();
            cv.cvtColor(src, bgr, cv.COLOR_RGBA2BGR);
            let lab = new cv.Mat();
            cv.cvtColor(bgr, lab, cv.COLOR_BGR2Lab);
            let channels = new cv.MatVector();
            cv.split(lab, channels);
            try {
                let clahe = cv.createCLAHE(2.0, new cv.Size(8, 8));
                clahe.apply(channels.get(0), channels.get(0));
                clahe.delete();
            } catch (e) {}
            cv.merge(channels, lab);
            channels.delete();
            cv.cvtColor(lab, bgr, cv.COLOR_Lab2BGR);
            lab.delete();
            let kernel = cv.matFromArray(3, 3, cv.CV_32F, [0, -1, 0, -1, 5, -1, 0, -1, 0]);
            let sharp = new cv.Mat();
            cv.filter2D(bgr, sharp, -1, kernel);
            kernel.delete();
            bgr.delete();
            let rgba = new cv.Mat();
            cv.cvtColor(sharp, rgba, cv.COLOR_BGR2RGBA);
            sharp.delete();
            return rgba;
        }

        async function processImage(file) {
            const inputCanvas = await loadImageToCanvas(file);
            if (!cvReady) return inputCanvas;
            let src = null,
                aligned = null,
                enhanced = null;
            const outCanvas = document.createElement('canvas');
            try {
                src = cv.imread(inputCanvas);
                aligned = detectAndAlign(src);
                src.delete();
                src = null;
                enhanced = enhanceImage(aligned);
                aligned.delete();
                aligned = null;
                cv.imshow(outCanvas, enhanced);
                enhanced.delete();
                return outCanvas;
            } catch (err) {
                console.warn(err);
                if (src) try { src.delete(); } catch (_) {}
                if (aligned) try { aligned.delete(); } catch (_) {}
                if (enhanced) try { enhanced.delete(); } catch (_) {}
                return inputCanvas;
            }
        }

        async function buildA4Page(imgCanvas, nameText) {
            await document.fonts.ready;
            const page = document.createElement('canvas');
            page.width = A4_W;
            page.height = A4_H;
            const ctx = page.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, A4_W, A4_H);
            const MARGIN = 60;
            let topOffset = MARGIN;
            if (nameText && nameText.trim()) {
                const fontSize = 52;
                ctx.font = `700 ${fontSize}px Cairo`;
                ctx.direction = 'rtl';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const label = `الاسم: ${nameText.trim()}`;
                const metrics = ctx.measureText(label);
                const textW = metrics.width;
                const boxH = fontSize + 30;
                const boxX = (A4_W - textW - 60) / 2;
                const boxY = MARGIN - 10;
                ctx.fillStyle = '#F5F5F5';
                ctx.strokeStyle = '#E0E0E0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(boxX + 20, boxY);
                ctx.lineTo(boxX + textW + 40, boxY);
                ctx.quadraticCurveTo(boxX + textW + 60, boxY, boxX + textW + 60, boxY + 20);
                ctx.lineTo(boxX + textW + 60, boxY + boxH - 20);
                ctx.quadraticCurveTo(boxX + textW + 60, boxY + boxH, boxX + textW + 40, boxY + boxH);
                ctx.lineTo(boxX + 20, boxY + boxH);
                ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - 20);
                ctx.lineTo(boxX, boxY + 20);
                ctx.quadraticCurveTo(boxX, boxY, boxX + 20, boxY);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#1C2B3A';
                ctx.fillText(label, A4_W / 2, boxY + boxH / 2);
                topOffset = MARGIN + boxH + 20;
            }
            const availW = A4_W - MARGIN * 2;
            const availH = A4_H - topOffset - MARGIN;
            const scale = Math.min(availW / imgCanvas.width, availH / imgCanvas.height);
            const dw = Math.round(imgCanvas.width * scale);
            const dh = Math.round(imgCanvas.height * scale);
            const dx = Math.round((A4_W - dw) / 2);
            const dy = topOffset + Math.round((availH - dh) / 2);
            ctx.drawImage(imgCanvas, dx, dy, dw, dh);
            return page;
        }

        // ══════════════════════════════════════════
        //  CONVERT TO PDF
        // ══════════════════════════════════════════
        document.getElementById('convertBtn').addEventListener('click', async () => {
            if (!selectedFiles.length) return;
            if (!cvReady) { showFlash('المحرك لا يزال يُحمَّل...');
                return; }
            const name = document.getElementById('nameInput').value.trim();
            const btn = document.getElementById('convertBtn');
            btn.disabled = true;
            document.getElementById('progressSection').style.display = 'block';
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            try {
                for (let i = 0; i < selectedFiles.length; i++) {
                    setProgress(Math.round((i / selectedFiles.length) * 90), `معالجة صورة ${i+1} من ${selectedFiles.length}...`);
                    await new Promise(r => setTimeout(r, 10));
                    const processed = await processImage(selectedFiles[i]);
                    const a4canvas = await buildA4Page(processed, name);
                    const imgData = a4canvas.toDataURL('image/jpeg', 0.88);
                    if (i > 0) doc.addPage();
                    doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                }
                setProgress(100, 'جاري حفظ الملف...');
                await new Promise(r => setTimeout(r, 200));
                const safeName = name ? name.replace(/\s+/g, '_') : 'document';
                doc.save(`${safeName}.pdf`);
                showFlash(`تم بنجاح! ${selectedFiles.length} صورة`, 'success');
            } catch (err) {
                console.error(err);
                showFlash('حدث خطأ أثناء المعالجة.');
            } finally {
                btn.disabled = false;
                document.getElementById('progressSection').style.display = 'none';
                setProgress(0, '');
            }
        });
    </script>
